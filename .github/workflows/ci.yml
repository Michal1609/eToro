name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore EToro.slnx

      - name: Build
        run: dotnet build EToro.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test EToro.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/*.trx"

      - name: NativeAOT smoke publish
        if: matrix.os == 'ubuntu-latest'
        run: dotnet publish tests/EToro.Aot.SmokeTest/EToro.Aot.SmokeTest.csproj --configuration Release --runtime linux-x64 --self-contained true /p:PublishAot=true /p:IlcTreatWarningsAsErrors=true -warnaserror:IL2026,IL2104,IL3050

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack src/EToro/EToro.csproj --configuration Release --no-build --output artifacts/packages

      - name: Upload NuGet artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/
