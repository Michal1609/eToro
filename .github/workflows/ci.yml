name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore EToro.slnx

      - name: Build
        run: dotnet build EToro.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test EToro.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
